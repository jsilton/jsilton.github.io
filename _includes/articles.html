<hr>

<div class="row">
	<div class="four columns">
		<h2>All writing</h2>
	</div>
	<div class="eight columns">
		<ul class="posts">
			{% for post in site.posts %}
			<li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><time class="post-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%B %-d, %Y' }}</time></li>
			{% endfor %}
		</ul>
	</div>
</div>
